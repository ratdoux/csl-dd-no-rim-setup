name: Build Windows portable app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Test, build, and verify the portable ZIP
        run: python scripts/build.py

      - name: Upload portable app and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CSL-DD-No-Rim-Setup-Windows-x64
          path: |
            release/*.zip
            release/*.sha256
            release/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CSL-DD-No-Rim-Setup-Windows-x64
          path: release
          digest-mismatch: error

      - name: Check tag matches the built app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $buildInfo = Get-Content -Raw -LiteralPath release/BUILD-INFO.json | ConvertFrom-Json
          $expectedTag = 'v' + $buildInfo.version
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match the built app version '$expectedTag'."
          }

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: CSL DD No-Rim Setup ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/CSL-DD-No-Rim-Setup-Windows-x64.zip
            release/CSL-DD-No-Rim-Setup-Windows-x64.zip.sha256
            release/BUILD-INFO.json
